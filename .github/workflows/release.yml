name: Release

# Runs when a pull request is merged into main: builds production Android and iOS apps on
# Expo (EAS Build) and publishes them as a GitHub Release. "Run workflow" on the Actions tab
# does the same by hand, for example to retry after a failure.
#
# Setup:
#   Secret   EXPO_TOKEN    Expo access token (required).
#   Variable IOS_RELEASE   Set to "true" once Apple signing is set up on EAS. Until then the
#                          iOS job is skipped and only Android is released.
on:
  pull_request:
    types: [closed]
    branches: [main]
    # A change that touches only documentation does not need a new build.
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: write

# One release at a time, so build numbers and tags stay in order.
concurrency:
  group: release
  cancel-in-progress: false

env:
  # The commit to build: the merge commit for a merged pull request, otherwise the commit
  # the workflow was started on.
  RELEASE_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  android:
    name: Android build and release
    # A pull request closed without merging must not release anything.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      tag: ${{ steps.details.outputs.tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out the merged code
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Check that the Expo token is configured
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::The EXPO_TOKEN secret is missing. Create an access token at https://expo.dev/settings/access-tokens and add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Install dependencies
        run: npm ci

      # Fail here, before a cloud build is spent, if the code does not type-check.
      - name: Type-check
        run: npx tsc --noEmit

      # Each release gets the next version: 1.0.0, then 1.0.1, and so on. Raising "version"
      # in app.json by hand (to 1.1.0, say) starts a new series. See scripts/next-version.mjs.
      - name: Decide the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONFIGURED=$(jq -r '.expo.version' app.json)
          TAGS=$(gh release list --limit 500 --json tagName --jq '.[].tagName')
          VERSION=$(node scripts/next-version.mjs "$CONFIGURED" $TAGS)
          echo "Releasing version $VERSION (app.json says $CONFIGURED)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # The version is written into app.json for this build only. It is committed in the
      # runner's copy (never pushed) so the files EAS uploads are certain to carry it.
      - name: Apply the version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          jq --arg v "$VERSION" '.expo.version = $v' app.json > app.json.tmp && mv app.json.tmp app.json
          if ! git diff --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet --all --message "Release $VERSION"
          fi

      - name: Build the production APK on Expo
        id: build
        run: |
          eas build --platform android --profile production --non-interactive --wait --json > build.json
          BUILD_ID=$(jq -r 'if type == "array" then .[0].id else .id end' build.json)
          if [ -z "$BUILD_ID" ] || [ "$BUILD_ID" = "null" ]; then
            echo "::error::Could not read the build id from the EAS output."
            cat build.json
            exit 1
          fi
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"

      - name: Read the build details
        id: details
        env:
          BUILD_ID: ${{ steps.build.outputs.build_id }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          eas build:view "$BUILD_ID" --json > details.json
          STATUS=$(jq -r '.status' details.json)
          APP_URL=$(jq -r '.artifacts.applicationArchiveUrl // .artifacts.buildUrl // empty' details.json)
          BUILT_VERSION=$(jq -r '.appVersion' details.json)
          BUILD_NUMBER=$(jq -r '.appBuildVersion' details.json)
          if [ "$STATUS" != "FINISHED" ] || [ -z "$APP_URL" ]; then
            echo "::error::The Android build did not finish with an APK (status: $STATUS)."
            exit 1
          fi
          if [ "$BUILT_VERSION" != "$VERSION" ]; then
            echo "::error::The APK was built as version $BUILT_VERSION, not $VERSION. Not releasing it under the wrong name."
            exit 1
          fi
          {
            echo "app_url=$APP_URL"
            echo "build_number=$BUILD_NUMBER"
            echo "tag=v${VERSION}"
            echo "file_name=MiFi-Manager-${VERSION}-android.apk"
          } >> "$GITHUB_OUTPUT"

      # Values are passed through the environment rather than pasted into the script text.
      - name: Download the APK
        env:
          APP_URL: ${{ steps.details.outputs.app_url }}
          FILE_NAME: ${{ steps.details.outputs.file_name }}
        run: curl --fail --location --silent --show-error --output "$FILE_NAME" "$APP_URL"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.details.outputs.tag }}
          FILE_NAME: ${{ steps.details.outputs.file_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$TAG" "$FILE_NAME" \
            --target "$RELEASE_SHA" \
            --title "MiFi Manager $VERSION" \
            --generate-notes \
            --latest

  ios:
    name: iOS build
    # Runs after a successful Android release, and only once Apple signing has been set up
    # and the IOS_RELEASE repository variable is set to "true".
    needs: android
    if: vars.IOS_RELEASE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out the merged code
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Install dependencies
        run: npm ci

      # Same version as the Android build in this release.
      - name: Apply the version
        env:
          VERSION: ${{ needs.android.outputs.version }}
        run: |
          jq --arg v "$VERSION" '.expo.version = $v' app.json > app.json.tmp && mv app.json.tmp app.json
          if ! git diff --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet --all --message "Release $VERSION"
          fi

      # Non-interactive: this uses the signing certificate and profile already stored on EAS.
      - name: Build the production iOS app on Expo
        id: build
        run: |
          eas build --platform ios --profile production --non-interactive --wait --json > build.json
          BUILD_ID=$(jq -r 'if type == "array" then .[0].id else .id end' build.json)
          if [ -z "$BUILD_ID" ] || [ "$BUILD_ID" = "null" ]; then
            echo "::error::Could not read the build id from the EAS output."
            cat build.json
            exit 1
          fi
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"

      - name: Read the build details
        id: details
        env:
          BUILD_ID: ${{ steps.build.outputs.build_id }}
          VERSION: ${{ needs.android.outputs.version }}
        run: |
          eas build:view "$BUILD_ID" --json > details.json
          STATUS=$(jq -r '.status' details.json)
          APP_URL=$(jq -r '.artifacts.applicationArchiveUrl // .artifacts.buildUrl // empty' details.json)
          if [ "$STATUS" != "FINISHED" ] || [ -z "$APP_URL" ]; then
            echo "::error::The iOS build did not finish with an app archive (status: $STATUS)."
            exit 1
          fi
          {
            echo "app_url=$APP_URL"
            echo "file_name=MiFi-Manager-${VERSION}-ios.ipa"
          } >> "$GITHUB_OUTPUT"

      - name: Download the iOS app
        env:
          APP_URL: ${{ steps.details.outputs.app_url }}
          FILE_NAME: ${{ steps.details.outputs.file_name }}
        run: curl --fail --location --silent --show-error --output "$FILE_NAME" "$APP_URL"

      - name: Add the iOS app to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.android.outputs.tag }}
          FILE_NAME: ${{ steps.details.outputs.file_name }}
        run: gh release upload "$TAG" "$FILE_NAME"
